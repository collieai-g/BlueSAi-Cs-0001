<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>網頁客服</title><link rel="stylesheet" href="/chat.css"><script src="/chat.js" defer></script></head>
<body><main><header><p class="eyebrow">BlueSAI · 客服</p><h1>有甚麼可以幫你？</h1><p>請留下問題。客服核對後會在這裡回覆；需要真人時可直接提出。</p></header>
<p id="notice" role="status" aria-live="polite">正在建立會話…</p>
<ol id="messages" aria-label="客服對話" aria-live="polite" aria-relevant="additions text"></ol>
<form id="message-form"><label for="message">你的訊息</label><textarea id="message" name="message" rows="3" maxlength="2000" required placeholder="請輸入你的問題"></textarea><div class="send-row"><small>請勿傳送密碼、付款卡資料或驗證碼。</small><button type="submit" disabled>傳送訊息</button></div></form>
<footer>這個瀏覽器會保留七日的會話入口。共用裝置請留意對話私隱。</footer></main></body></html>
