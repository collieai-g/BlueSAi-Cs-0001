name: Verify preview package
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
concurrency:
  group: preview-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: npm run check
      - run: npm run feedback:audit
      - run: python -B -X utf8 -m unittest discover -s integrations/whatsapp-local/maintenance -p test_relink_auth.py -v
      - name: Verify pinned local WhatsApp bridge dependencies without starting an account
        run: npm ci --prefix integrations/whatsapp-local --ignore-scripts --omit=optional
      - name: Read-only contract fixture preflight
        shell: pwsh
        run: |
          $revision = git rev-parse HEAD
          node tools/preflight.js --host integrations/blueprint/fixtures/host.json --mode collaboration --source $revision
      - name: Build exact committed preview artifact
        shell: pwsh
        run: node tools/package-release.js --output "${{ runner.temp }}/bluesai-release"
      - uses: actions/upload-artifact@v4
        with:
          name: bluesai-preview-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/bluesai-release/
